name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Reference engine for the PostgreSQL tests (D-011): synthetic rows only, no password.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      FACT_PG_DSN: postgresql://postgres@localhost:5432/postgres
      # tests/examples/test_tpch.py builds TPC-H at scale factor 0.01 here (both pytest steps).
      # Scale factor 1 is the example's documented run (examples/tpch/README.md) and is
      # reproduced locally with examples/tpch/scripts/reproduce.sh.
      FACT_TPCH_SF: "0.01"
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tag since v8; the full version is the only pin
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
          DO_NOT_TRACK: "1"
      - name: Build and check the package
        run: uv build && uv run twine check dist/*
      - name: Documentation site
        run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Chinook gate
        run: uv run fact check --root examples/chinook
      - name: QCEW gate
        run: uv run fact check --root examples/qcew
      - name: TPC-H gate
        run: uv run fact check --root examples/tpch
      - name: Examples on PostgreSQL and DuckDB (same snapshot parts and probe counts as SQLite)
        run: uv run pytest -q tests/examples
