name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Reference engine for the PostgreSQL tests (D-011): synthetic rows only, no password.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      FACT_PG_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
          DO_NOT_TRACK: "1"
      - name: Build and check the package
        run: uv build && uv run twine check dist/*
      - name: Documentation site
        run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Chinook gate (M1)
        run: uv run fact check --root examples/chinook
      - name: QCEW gate (M2)
        run: uv run fact check --root examples/qcew
      - name: Examples on PostgreSQL and DuckDB (same snapshot parts and probe counts as SQLite)
        run: uv run pytest -q tests/examples
