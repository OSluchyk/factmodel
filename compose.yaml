# Local PostgreSQL for tests and the Chinook example (D-011): a test fixture, not a platform.
# No password: the container trusts local connections and holds only synthetic rows.
#   docker compose up -d --wait
#   export FACT_PG_DSN=postgresql://postgres@localhost:55432/postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
