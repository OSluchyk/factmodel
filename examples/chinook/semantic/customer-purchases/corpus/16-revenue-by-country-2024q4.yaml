id: revenue-by-country-2024q4
request:
  ask: measure
  measure: revenue
  by: country
  from: '2024-10-01'
  to: '2025-01-01'
reference: SELECT i.BillingCountry AS key, SUM(l.UnitPrice * l.Quantity) AS value FROM invoice AS i JOIN invoice_line AS l ON l.InvoiceId = i.InvoiceId JOIN track AS t ON t.TrackId = l.TrackId JOIN genre AS g ON g.GenreId = t.GenreId WHERE i.InvoiceDate >= '2024-10-01' AND i.InvoiceDate < '2025-01-01' GROUP BY i.BillingCountry
mode: same_rows
