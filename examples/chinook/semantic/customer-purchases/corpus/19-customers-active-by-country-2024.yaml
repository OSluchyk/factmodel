id: customers-active-by-country-2024
request:
  ask: measure
  measure: customers_active
  by: country
  from: '2024-01-01'
  to: '2025-01-01'
reference: SELECT i.BillingCountry AS key, COUNT(DISTINCT i.CustomerId) AS value FROM invoice AS i JOIN invoice_line AS l ON l.InvoiceId = i.InvoiceId JOIN track AS t ON t.TrackId = l.TrackId JOIN genre AS g ON g.GenreId = t.GenreId WHERE i.InvoiceDate >= '2024-01-01' AND i.InvoiceDate < '2025-01-01' GROUP BY i.BillingCountry
mode: same_rows
