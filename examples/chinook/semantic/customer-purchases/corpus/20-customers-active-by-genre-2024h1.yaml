id: customers-active-by-genre-2024h1
request:
  ask: measure
  measure: customers_active
  by: genre
  from: '2024-01-01'
  to: '2024-07-01'
reference: SELECT g.Name AS key, COUNT(DISTINCT i.CustomerId) AS value FROM invoice AS i JOIN invoice_line AS l ON l.InvoiceId = i.InvoiceId JOIN track AS t ON t.TrackId = l.TrackId JOIN genre AS g ON g.GenreId = t.GenreId WHERE i.InvoiceDate >= '2024-01-01' AND i.InvoiceDate < '2024-07-01' GROUP BY g.Name
mode: same_rows
