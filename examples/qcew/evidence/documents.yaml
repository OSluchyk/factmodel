- id: ev-doc-crosswalk-baltimore
  source: bls-crosswalk
  pin: BLS QCEW County-MSA-CSA Crosswalk xlsx sha256:9180c5a1784a@2026-11-28
  quote: 'C1258 Baltimore-Columbia-Towson, MD MSA: 24003 Anne Arundel, 24005 Baltimore, 24013 Carroll, 24025 Harford, 24027 Howard, 24035 Queen Anne''s County and 24510 Baltimore City, Maryland.'
  status: confirmed
