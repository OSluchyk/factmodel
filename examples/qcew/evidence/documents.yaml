- id: ev-doc-msa-totals-only
  source: bls-notices
  pin: BLS QCEW notices and method pages@2026-11-28
  quote: at only the total covered employment for the area
  status: inferred
  read_on: '2026-11-28'
  note: 'From the notice Change in the presentation of Metropolitan Statistical Area (MSA) data in QCEW, last modified December 30, 2025: beginning with third quarter 2025 data, released on March 10, 2026, an MSA is published for its total only, and detail by industry can be rebuilt from county rows with the crosswalk. The QCEW overview page, last modified January 28, 2026, names the second quarter of 2025 instead; the rows agree with the notice (measurements/padding-by-quarter.txt). Inferred: read by the agent, not opened by the owner.'
- id: ev-doc-confidentiality
  source: bls-notices
  pin: BLS QCEW notices and method pages@2026-11-28
  quote: Details regarding the methods used to protect the data are not shared
  status: inferred
  read_on: '2026-11-28'
  note: 'From the Handbook of Methods, QCEW, Presentation. No BLS page found on the day of the read states a change of the disclosure rules for state or county rows in 2025: the news release notes of 2025 name a shutdown delay, one dropped county and the move to one data release; the notices of 2025 and 2026 name the MSA change, an erratum and pending corrections to first quarter 2025 files; the page on state and local government data lists Delaware and Maryland as sensitive since 2022-1 and was last modified November 11, 2022. Inferred: read by the agent, not opened by the owner.'
- id: ev-doc-msa-totals-overview
  source: bls-notices
  pin: BLS QCEW notices and method pages@2026-11-28
  quote: QCEW changed publication of all MSA data to totals only
  status: inferred
  read_on: '2026-11-28'
  note: 'From the QCEW overview page, section Data Available, last modified January 28, 2026. The sentence opens with the second quarter of 2025 as the start and links to the notice, which names the third quarter (ev-doc-msa-totals-only). The rows agree with the notice: the levels 41 to 48 hold records in 2025 Q2 and none in 2025 Q3 (measurements/msa-levels-by-quarter.txt). Inferred: read by the agent, not opened by the owner.'
