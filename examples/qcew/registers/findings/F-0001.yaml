kind: finding
id: F-0001
title: The BLS area code list repeats 4,649 codes
status: open
opened_on: '2026-10-27'
about:
- area_titles
- annual.to-area
- qtrly.to-area
- area_titles.in-state
description: >-
  key_duplicates on the committed area_titles.csv, loaded unchanged, measured 4,649 codes that occur
  twice (9,458 rows, 4,809 distinct codes, identical titles; profile.md R1, Q22). The file is two
  lists one after the other, the second starting with its own header line, which loads as one row
  whose code is the text area_fips. On the published rows a plain join from qtrly to the list returns
  972,200 rows for 486,100, exactly double, and a join to distinct codes returns 486,100 (measurements/cardinality-area-titles.txt).
  So the relationships to the list are many_to_many as published, and fact propose joins does not
  propose them, because the target column is not unique. Open until BLS answers which copy is meant
  (the www.bls.gov copy has 4,649 rows, all distinct, profile.md A3); the employment-wages layer joins
  to distinct codes.
