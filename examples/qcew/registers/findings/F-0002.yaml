description: >-
  The layouts document two values of disclosure_code, blank and N. value_set on the seeded
  qtrly table found one value outside that domain on 2 rows: the '-' padding rows the seed
  reproduces from profile.md V1 and Q07 (in the real 2025 quarterly file, 47,061 rows in Q1 up
  to 612,719 in Q3, every measure 0). Open until BLS documents the value; a consumer must
  treat '-' as "no record in this quarter" (F-0006), not as disclosed.
