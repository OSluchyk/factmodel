kind: finding
id: F-0003
title: Suppressed measures are 0, not NULL, and establishment counts stay filled
status: open
opened_on: '2026-10-27'
about:
- annual
- qtrly
description: >-
  On a row with disclosure_code N, employment and wages are stored as 0, while qtrly_estabs and
  annual_avg_estabs keep their value (profile.md V2, Q07). null_rate on the seeded tables shows
  no NULL in month1_emplvl (1,136 of 1,136 rows) or annual_avg_emplvl (282 of 282), suppressed
  rows included. A sum or average over these fields counts suppressed cells as zero; a consumer
  must filter on disclosure_code first. Open: the platform behaves this way by design, and the
  semantic layer has to encode the filter.
evidence:
- ev-doc-suppressed-zero
- ev-null-rate-qtrly-month1-emplvl-2026-10-27
- ev-null-rate-annual-annual-avg-emplvl-2026-10-27
