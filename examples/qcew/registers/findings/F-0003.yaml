kind: finding
id: F-0003
title: Suppressed measures are 0, not NULL, and establishment counts stay filled
status: open
opened_on: '2026-10-27'
about:
- annual
- qtrly
description: >-
  On a row with disclosure_code N, employment and wages are stored as 0, while qtrly_estabs and annual_avg_estabs
  keep their value (profile.md V2, Q07). On the published rows null_rate found no NULL in month1_emplvl
  (486,100 of 486,100 rows) or annual_avg_emplvl (110,366 of 110,366). Of the quarterly rows 250,155
  are withheld: all of them hold 0 in the three monthly levels and in total wages, and all of them
  carry an establishment count (measurements/suppressed-zero.txt). Withheld rows are 13.3 percent
  of the national rows, 28.4 percent of the state rows, 54.9 percent of the county rows and 64.7 percent
  of the MSA rows (measurements/suppression-by-geography.txt). The share is not steady over time (measurements/withheld-by-quarter.txt).
  In Delaware it is higher in every quarter of 2025 than in the same quarter of 2024 at every level
  that has withheld rows: at level 73, 24.1 percent in each quarter of 2024 and 48.9 in the first
  quarter of 2025. In Maryland the county levels 73 and 74 are higher in every quarter of 2025, and
  the levels 75 to 78 move by less than 3 points. The rise starts in the first quarter of 2025. The
  load is not the cause: rows, withheld rows and padding rows are equal in the raw slices and in the
  loaded tables in all 12 groups of table, year and state (measurements/load-check.txt). No BLS page
  read on 2026-11-28 states a change of the disclosure rules for 2025 (ev-doc-confidentiality), so
  the cause is not known. A sum or average over these fields counts withheld cells as zero; a consumer
  must filter on disclosure_code first. Open: the platform behaves this way by design, and the semantic
  layer encodes the filter.
