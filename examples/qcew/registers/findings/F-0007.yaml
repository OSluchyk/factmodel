description: >-
  A parent can be disclosed while its children are suppressed, and the reverse (profile.md H5,
  Q16): summing children never rebuilds a parent where any cell is N. Inferred from the
  document; the seed reproduces both directions (Kent County construction suppressed under a
  disclosed supersector; Montgomery County retail suppressed over disclosed children). A probe
  that compares a parent with the sum of its children needs a probe kind the framework does
  not have yet; it is deferred to M3.
