kind: finding
id: F-0007
title: Suppression breaks every rollup
status: open
opened_on: '2026-10-27'
about:
- annual
- qtrly
- industry_titles.parent
- area_titles.in-state
description: >-
  A parent can be disclosed while its children are suppressed, and the reverse (profile.md H5,
  Q16): summing children never rebuilds a parent where any cell is N. Measured
  with rollup probes (D-020) on the seed, whose parents are true sums of their children. For
  third-month employment, county to state: 296 parents with nothing suppressed, all exact
  (M5), and 24 parents with a suppressed child. NAICS child to parent: 216 parents, all exact,
  and 8 suppressed parents with disclosed children. The employment-wages layer excludes
  suppressed cells and reports them in suppressed_cells; the finding stays open because the
  platform publishes this way by design.
