kind: hazard
id: H-0001
title: Annual averages are not additive
status: active
description: >-
  annual_avg_emplvl and annual_avg_estabs are rounded averages: county or 3-digit sums differ from
  their parents by up to the number of children even with nothing suppressed (profile.md M4, Q14,
  Q17). Monthly levels and wages are additive where nothing is suppressed (M5). A semantic layer must
  aggregate from monthly levels, never sum annual averages. Measured with a rollup probe (D-020) on
  the published rows: the rollup of annual_avg_emplvl from counties to states is exact for 984 of
  1,362 parents with nothing suppressed and within rounding for 378, never beyond; the differences
  run from -3 to 3 (measurements/annual-average-rollup-differences.txt).
applies_to:
- annual
- annual.to-quarters
evidence:
- ev-doc-m4
- ev-rollup-annual-employment-area-titles-in-state-2026-10-27
- ev-rollup-annual-employment-area-titles-in-state-2026-11-28
- ev-measure-annual-rollup-2026-11-28
