id: montgomery-total-weekly-wage-2025q4
request:
  measure: avg_weekly_wage
  area: '24031'
  industry: '10'
  ownership: '0'
  year: '2025'
  qtr: '4'
reference: WITH sel AS (SELECT * FROM qtrly WHERE area_fips = '24031' AND industry_code = '10' AND own_code = '0' AND year = '2025' AND qtr = '4' AND agglvl_code = '70') SELECT SUM(CASE WHEN disclosure_code IS NULL THEN total_qtrly_wages END) / ((SUM(CASE WHEN disclosure_code IS NULL THEN month1_emplvl END) + SUM(CASE WHEN disclosure_code IS NULL THEN month2_emplvl END) + SUM(CASE WHEN disclosure_code IS NULL THEN month3_emplvl END)) / 3.0) / 13 AS value, SUM(CASE WHEN disclosure_code = 'N' THEN 1 ELSE 0 END) AS suppressed_cells FROM sel
mode: same_rows
