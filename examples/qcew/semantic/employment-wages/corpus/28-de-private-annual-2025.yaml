id: de-private-annual-2025
request:
  measure: annual_employment
  area: '10000'
  industry: '10'
  ownership: '5'
  year: '2025'
reference: WITH sel AS (SELECT * FROM annual WHERE area_fips = '10000' AND industry_code = '10' AND own_code = '5' AND year = '2025' AND agglvl_code = '51') SELECT MAX(CASE WHEN disclosure_code IS NULL THEN annual_avg_emplvl END) AS value, SUM(CASE WHEN disclosure_code = 'N' THEN 1 ELSE 0 END) AS suppressed_cells FROM sel
mode: same_rows
note: "Naive SQL: SELECT SUM(annual_avg_emplvl) FROM annual WHERE area_fips IN ('10001', '10003', '10005') AND industry_code = '10' AND own_code = '5' AND year = '2025' Why it differs: on the published slice Kent County's annual row is withheld and stored as 0 (F-0003), so the county sum is 354575; and where every county is disclosed, rounded averages still miss their state by up to three (H-0001). Published BLS row: slice 2025/a/area/10000.csv, own_code 5, industry_code 10, agglvl_code 51, disclosure_code blank; annual_avg_emplvl 412488."
