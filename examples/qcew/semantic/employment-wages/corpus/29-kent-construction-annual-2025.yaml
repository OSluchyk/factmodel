id: kent-construction-annual-2025
request:
  measure: annual_employment
  area: '10001'
  industry: '23'
  ownership: '5'
  year: '2025'
reference: WITH sel AS (SELECT * FROM annual WHERE area_fips = '10001' AND industry_code = '23' AND own_code = '5' AND year = '2025' AND agglvl_code = '74') SELECT MAX(CASE WHEN disclosure_code IS NULL THEN annual_avg_emplvl END) AS value, SUM(CASE WHEN disclosure_code = 'N' THEN 1 ELSE 0 END) AS suppressed_cells FROM sel
mode: same_rows
