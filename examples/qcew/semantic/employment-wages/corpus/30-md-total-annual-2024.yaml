id: md-total-annual-2024
request:
  measure: annual_employment
  area: '24000'
  industry: '10'
  ownership: '0'
  year: '2024'
reference: WITH sel AS (SELECT * FROM annual WHERE area_fips = '24000' AND industry_code = '10' AND own_code = '0' AND year = '2024' AND agglvl_code = '50') SELECT MAX(CASE WHEN disclosure_code IS NULL THEN annual_avg_emplvl END) AS value, SUM(CASE WHEN disclosure_code = 'N' THEN 1 ELSE 0 END) AS suppressed_cells FROM sel
mode: same_rows
