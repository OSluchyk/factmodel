[project]
name = "factmodel"
version = "0.1.0"
description = "Evidence-grounded semantic models of data platforms, built and checked by AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Oleksandr Sluchyk" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.23",
    "pydantic>=2",
    "sqlglot>=30.24.0",
]

[project.scripts]
fact = "factmodel.cli:app"

[project.entry-points."factmodel.adapters"]
export = "factmodel.adapters.export:ExportAdapter"
sql = "factmodel.adapters.sql:SqlAdapter"
git = "factmodel.adapters.git:GitAdapter"

[project.optional-dependencies]
sql = [
    "sqlalchemy>=2.0",
]
postgres = [
    "psycopg[binary]>=3",
]
duckdb = [
    "duckdb>=1.1",
    "duckdb-engine>=0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-jsonschema>=4.26.0.20261006",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "duckdb>=1.1",
    "duckdb-engine>=0.17.0",
    "factmodel-csvdir",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
]

[tool.uv.sources]
# The example third-party adapter (docs/adapters/packaging.md), installed for the tests.
factmodel-csvdir = { path = "tests/fixtures/plugin", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factmodel"]

[tool.hatch.build.targets.wheel.force-include]
"spec/VOCABULARY.md" = "factmodel/VOCABULARY.md"
"profiles" = "factmodel/profiles"
"agent" = "factmodel/agent"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# The spec shows illustrative Python in Markdown; it is not formatted as code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/factmodel"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
