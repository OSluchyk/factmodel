# Shared definitions. build.py copies the ones a schema uses into its own $defs,
# so every rendered schema is self-contained.
$defs:
  slug:
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
  slugs:
    type: array
    items: {$ref: "#/$defs/slug"}
    uniqueItems: true
  text:
    type: string
    minLength: 1
  date:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  field_name:
    description: An engine column name or one segment of a nested path.
    type: string
    pattern: "^[^\\s.]+$"
  field_path:
    description: Dotted path of a nested field, at least two segments.
    type: string
    pattern: "^[^\\s.]+(\\.[^\\s.]+)+$"
  field_address:
    description: A field's name, or its dotted path when nested.
    type: string
    pattern: "^[^\\s.]+(\\.[^\\s.]+)*$"
  field_ref:
    description: "<entity-id>.<field name or path>"
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{0,63}(\\.[^\\s.]+)+$"
  relationship_ref:
    description: "<entity-id>.<relationship-key> (D-002)"
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{0,63}\\.[a-z0-9][a-z0-9_-]{0,63}$"
  model_ref:
    description: An entity ID or a relationship reference.
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{0,63}(\\.[a-z0-9][a-z0-9_-]{0,63})?$"
  model_refs:
    type: array
    items: {$ref: "#/$defs/model_ref"}
    minItems: 1
    uniqueItems: true
  join:
    description: >-
      <entity>.<field> = <entity>.<field>, joined with AND for composite keys; or a boolean SQL
      expression in sqlglot's neutral dialect whose columns are all qualified by the source and
      target entity ids (D-017). One line; the loader parses it.
    type: string
    pattern: "^\\S(.*\\S)?$"
  finding_id:
    type: string
    pattern: "^F-[0-9]{4}$"
  escalation_id:
    type: string
    pattern: "^E-[0-9]{4}$"
  hazard_id:
    type: string
    pattern: "^H-[0-9]{4}$"
  decision_id:
    type: string
    pattern: "^D-[0-9]{4}$"
  hazard_refs:
    type: array
    items: {$ref: "#/$defs/hazard_id"}
    minItems: 1
    uniqueItems: true
  evidence_refs:
    description: Evidence IDs; at least one.
    type: array
    items: {$ref: "#/$defs/slug"}
    minItems: 1
    uniqueItems: true
  pin:
    description: The exact version read; the format depends on the source kind.
    type: string
    pattern: "^\\S.*@\\S+$"
  quote:
    description: A verbatim quote, at most 40 words.
    type: string
    pattern: "^\\s*\\S+(\\s+\\S+){0,39}\\s*$"
  measurement:
    description: Counts and rates only, never values or identifiers.
    type: object
    minProperties: 1
    propertyNames: {$ref: "#/$defs/slug"}
    additionalProperties: {type: number}
  extensions:
    description: A free map for adopters; never read by the core.
    type: object
  evidence_record:
    type: object
    additionalProperties: false
    required: [id, source, pin, status, read_on]
    properties:
      id: {$ref: "#/$defs/slug"}
      source: {$ref: "#/$defs/slug"}
      pin: {$ref: "#/$defs/pin"}
      quote: {$ref: "#/$defs/quote"}
      measurement: {$ref: "#/$defs/measurement"}
      status: {$vocab: evidence_status}
      read_on: {$ref: "#/$defs/date"}
      probe: {$ref: "#/$defs/slug"}
      environment: {$ref: "#/$defs/slug"}
      data_quality: {$vocab: data_quality}
      named_error: {$ref: "#/$defs/text"}
      superseded_by: {$ref: "#/$defs/slug"}
      note: {$ref: "#/$defs/text"}
    oneOf:
      - required: [quote]
      - required: [measurement]
    allOf:
      - if:
          required: [status]
          properties: {status: {$const: "evidence_status:retracted"}}
        then:
          required: [named_error, superseded_by]
      - if:
          required: [probe]
        then:
          required: [environment, data_quality]
  evidence_records:
    description: Inline evidence records.
    type: array
    items: {$ref: "#/$defs/evidence_record"}
    minItems: 1
