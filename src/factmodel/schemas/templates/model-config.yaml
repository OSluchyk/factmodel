title: Model config
description: The root file of a model repository (factmodel.yaml).
type: object
additionalProperties: false
required: [kind, id, framework_version, profile]
properties:
  kind: {$const: "file_kind:model-config"}
  id: {$ref: "#/$defs/slug"}
  title: {$ref: "#/$defs/text"}
  framework_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  profile: {$ref: "#/$defs/slug"}
  anchor_entity:
    description: >-
      The entity that holds the profile's subjects (D-012). Required when the profile names a
      subject, absent when it names none (D-015); the loader checks this.
    $ref: "#/$defs/slug"
  adapters: {$ref: "#/$defs/slugs"}
  consumers: {$ref: "#/$defs/slugs"}
  environments: {$ref: "#/$defs/slugs"}
  treat_synthetic_as_representative:
    description: >-
      Example and test models only - probe results on synthetic data confirm facts as if they
      were representative (D-014). A model of a real platform never sets it.
    type: boolean
  ranks:
    description: Rank overrides per source kind; lower wins.
    type: object
    propertyNames: {$vocab: source_kind}
    additionalProperties: {type: integer, minimum: 0}
  extensions: {$ref: "#/$defs/extensions"}
