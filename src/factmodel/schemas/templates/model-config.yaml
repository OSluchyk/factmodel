title: Model config
description: The root file of a model repository (factmodel.yaml).
type: object
additionalProperties: false
required: [kind, id, framework_version, profile, anchor_entity]
properties:
  kind: {$const: "file_kind:model-config"}
  id: {$ref: "#/$defs/slug"}
  title: {$ref: "#/$defs/text"}
  framework_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  profile: {$ref: "#/$defs/slug"}
  anchor_entity:
    description: The entity that holds the profile's subjects (D-012).
    $ref: "#/$defs/slug"
  adapters: {$ref: "#/$defs/slugs"}
  consumers: {$ref: "#/$defs/slugs"}
  environments: {$ref: "#/$defs/slugs"}
  ranks:
    description: Rank overrides per source kind; lower wins.
    type: object
    propertyNames: {$vocab: source_kind}
    additionalProperties: {type: integer, minimum: 0}
  extensions: {$ref: "#/$defs/extensions"}
