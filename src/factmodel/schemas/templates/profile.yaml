title: Profile
description: The domain layer over the core - anchor entity, labels and ordered projection rules.
type: object
additionalProperties: false
required: [kind, id, subject, labels, rules]
properties:
  kind: {$const: "file_kind:profile"}
  id: {$ref: "#/$defs/slug"}
  meaning: {$ref: "#/$defs/text"}
  subject:
    description: The role of the rows this domain is about, for example customer (D-012).
    $ref: "#/$defs/text"
  labels:
    description: The labels rules may assign. The core reserves withheld.
    type: array
    items: {$ref: "#/$defs/slug"}
    minItems: 1
    uniqueItems: true
    not:
      contains: {$const: "derived_value:withheld"}
  vocabularies:
    type: object
    propertyNames: {$ref: "#/$defs/slug"}
    additionalProperties:
      type: array
      items: {$ref: "#/$defs/slug"}
      minItems: 1
      uniqueItems: true
  rules:
    description: Evaluated in order; the first match wins.
    type: array
    minItems: 1
    items: {$ref: "#/$defs/rule"}
  extensions: {$ref: "#/$defs/extensions"}
$defs:
  rule:
    type: object
    additionalProperties: false
    required: [when, label]
    properties:
      when: {$ref: "#/$defs/facets"}
      label: {$ref: "#/$defs/slug"}
      note: {$ref: "#/$defs/text"}
  facets:
    description: All listed facets must hold. At least one facet; there is no catch-all rule.
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      evidence_status: {$vocab: evidence_status}
      mechanism: {$vocab: mechanism}
      cardinality: {$vocab: cardinality}
      any_end_class: {$vocab: entity_class}
      all_ends_class: {$vocab: entity_class}
      any_end_subject_scoped: {type: boolean}
      all_ends_subject_scoped: {type: boolean}
      all_ends_match:
        description: Every end matches at least one of these patterns.
        type: array
        minItems: 1
        items: {$ref: "#/$defs/end_pattern"}
  end_pattern:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      class: {$vocab: entity_class}
      subject_scoped: {type: boolean}
