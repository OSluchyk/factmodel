title: Source
description: One entry in the source registry. Records how access is obtained, never a secret.
type: object
additionalProperties: false
required: [kind, id, title, source_kind, access_mode]
properties:
  kind: {$const: "file_kind:source"}
  id: {$ref: "#/$defs/slug"}
  title: {$ref: "#/$defs/text"}
  source_kind: {$vocab: source_kind}
  access_mode: {$vocab: access_mode}
  rank:
    description: Overrides the default rank of the source kind; lower wins.
    type: integer
    minimum: 0
  engine:
    description: For a warehouse, the engine slug used in pins.
    $ref: "#/$defs/slug"
  location: {$ref: "#/$defs/text"}
  access:
    description: How access is obtained. Never a secret.
    $ref: "#/$defs/text"
  meaning: {$ref: "#/$defs/text"}
  extensions: {$ref: "#/$defs/extensions"}
allOf:
  - if:
      required: [source_kind]
      properties: {source_kind: {$const: "source_kind:warehouse"}}
    then:
      required: [engine]
