kind: entity
id: inventory_items
physical_name: shop.inventory_items
grain: one row per inventory_items row
class: data
status: draft
keys:
  primary:
  - id
evidence:
- ev-confirmed
fields:
- name: id
  type: INT64
  nullable: false
  meaning: The id.
- name: product_id
  type: INT64
  nullable: true
  meaning: The product_id.
relationships:
- key: stocks
  to: products
  join: inventory_items.product_id = products.id
  meaning: The product in stock.
  mechanism: inferred_join
  cardinality: many_to_one
  evidence:
  - ev-confirmed
