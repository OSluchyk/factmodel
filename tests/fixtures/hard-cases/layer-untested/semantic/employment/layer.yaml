kind: layer
id: employment
purpose: Employment by area and industry.
consumer: employment-sql
status: reviewed
entities:
- entity: employment
  current_row_rule: null
- entity: areas
  current_row_rule: null
joins:
- employment.in-area
concepts:
- id: area
  meaning: The area a row is about.
  field: areas.area_code
measures:
- id: employment
  meaning: Employees, summed over the rows selected.
  expression: employment.employment
  aggregation: sum
  grain: {entity: employment, fields: [area_code, industry_code, year]}
  time: {field: employment.year, granularity: year}
  suppressed: not_applicable
  hazards: [H-0001]
hazards: [H-0001]
untested:
- kind: entity
  id: areas
  reason: Only the join to areas needs it; a corpus item that names an area would test it.
- kind: join
  id: employment.in-area
  reason: Areas are read only through it; an item that reports by area title would test it.
- kind: concept
  id: area
  reason: Requests by area are planned; an item filtered by area code would test it.
