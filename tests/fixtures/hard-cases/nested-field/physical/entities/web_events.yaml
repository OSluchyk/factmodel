  mechanism: inferred_join
  cardinality: many_to_one
  evidence:
  - ev-confirmed
- key: by-user
  to: users
  join: web_events.context.user_id = users.id
  meaning: The user, from the nested context.
  mechanism: inferred_join
  cardinality: many_to_one
  evidence:
  - ev-confirmed
