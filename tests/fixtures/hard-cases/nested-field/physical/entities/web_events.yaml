  - event_id
anchor_reference:
  field: context.user_id
  evidence:
  - ev-confirmed
evidence:
- ev-confirmed
fields:
- name: event_id
  type: STRING
  nullable: false
  meaning: Event.
- name: sessions_id
  type: STRING
  nullable: false
  meaning: The session.
- name: context
  type: STRUCT
  nullable: true
  meaning: Who and where.
- name: user_id
  path: context.user_id
  type: INT64
  nullable: true
  meaning: The signed-in user.
- name: tags
  type: STRING
  nullable: false
  repeated: true
  meaning: Free tags.
relationships:
- key: in-session
  to: sessions
