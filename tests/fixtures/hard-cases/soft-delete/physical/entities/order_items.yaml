kind: entity
id: order_items
physical_name: shop.order_items
grain: one row per order_items row
class: data
status: draft
keys:
  primary:
  - id
  current_row_rule: deleted_at IS NULL
evidence:
- ev-confirmed
fields:
- name: id
  type: INT64
  nullable: false
  meaning: Identifier.
- name: orders_id
  type: INT64
  nullable: true
  meaning: The orders row this row points to.
- name: deleted_at
  type: TIMESTAMP
  nullable: true
  meaning: Set when the item is deleted; the row stays.
relationships:
- key: part-of
  to: orders
  join: order_items.orders_id = orders.id
  meaning: Link from order_items to orders.
  mechanism: inferred_join
  cardinality: many_to_one
  scope_admission:
    basis: unique_target
    evidence:
    - ev-confirmed
  evidence:
  - ev-confirmed
