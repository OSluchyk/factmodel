# reason: a layer lists its entities
# expect: $
kind: layer
id: customer-filters
purpose: Select customers by what they ordered.
consumer: filter-sql
status: draft
joins: [orders.placed-by, order_items.part-of]
concepts:
  - id: not-cancelled
    meaning: Cancelled orders are not purchases.
    predicate: orders.status <> 'Cancelled'
    required: true
  - id: product-category
    meaning: The category of a product sold.
    field: products.category
    values: [Jeans, Tops]
measures:
  - id: order-count
    meaning: Number of orders.
    expression: orders.order_id
    aggregation: count_distinct
    grain: {entity: orders, fields: [order_id]}
    time: {field: orders.created_at, granularity: day}
    suppressed: not_applicable
