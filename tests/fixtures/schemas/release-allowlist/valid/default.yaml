kind: release-allowlist
files:
  - pattern: physical/entities/*.yaml
    disposition: project
  - pattern: registers/hazards/*.yaml
    disposition: export
  - pattern: drafts/**
    disposition: refuse
    reason: Drafts are not reviewed.
keys:
  entity:
    keep: [kind, id, physical_name, grain, class, status, keys, fields, relationships]
    drop: [source, evidence, records, extensions]
