# Test vector - spec/ALGORITHMS.md, projection.
algorithm: projection
case: discriminator
description: 'Rule 0: in a discriminated target set, a residue target makes the relationship residue.'
input:
  files:
  - kind: source
    id: shop-db
    title: Shop database
    source_kind: warehouse
    access_mode: export_file
    engine: postgres
  - kind: evidence
    records:
    - id: ev-confirmed
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: catalog read
      status: confirmed
      read_on: '2026-11-01'
    - id: ev-inferred
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: column names match
      status: inferred
      read_on: '2026-11-01'
    - id: ev-unresolved
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: not checked yet
      status: unresolved
      read_on: '2026-11-01'
    - id: ev-retracted
      source: shop-db
      pin: postgres:shop.public@2026-10-01
      quote: joined on email
      status: retracted
      read_on: '2026-10-01'
      named_error: The join used email, which is not unique.
      superseded_by: ev-confirmed
  - kind: profile
    id: retail
    anchor_entity: users
    labels:
    - customer_scoped
    - configuration
    - administrative
    - lineage
    - representation
    - unresolved
    rules:
    - when:
        evidence_status: unresolved
      label: unresolved
    - when:
        mechanism: derivation
      label: lineage
    - when:
        mechanism: representation
      label: representation
    - when:
        any_end_class: administrative
      label: administrative
    - when:
        any_end_class: configuration
      label: configuration
    - when:
        all_ends_match:
        - class: data
          subject_scoped: true
        - class: reference
        any_end_subject_scoped: true
      label: customer_scoped
  - kind: entity
    id: users
    physical_name: shop.users
    grain: one row per users row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
  - kind: entity
    id: orders
    physical_name: shop.orders
    grain: one row per orders row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    anchor_reference:
      field: user_id
      evidence:
      - ev-confirmed
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: user_id
      type: INT64
      nullable: true
      meaning: The user this row belongs to.
  - kind: entity
    id: inventory_items
    physical_name: shop.inventory_items
    grain: one row per inventory_items row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
  - kind: entity
    id: comments
    physical_name: shop.comments
    grain: one row per comments row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    anchor_reference:
      field: author_id
      evidence:
      - ev-confirmed
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: author_id
      type: INT64
      nullable: true
      meaning: The user this row belongs to.
    - name: owner_id
      type: INT64
      nullable: true
      meaning: The object this row is about.
    - name: owner_type
      type: STRING
      nullable: false
      meaning: The kind of object this row is about.
    relationships:
    - key: on
      to:
      - inventory_items
      - orders
      discriminator: owner_type
      join:
        inventory_items: comments.owner_id = inventory_items.id
        orders: comments.owner_id = orders.id
      meaning: Link from comments to inventory_items or orders.
      mechanism: inferred_join
      cardinality: many_to_one
      evidence:
      - ev-confirmed
expected:
  labels: []
  residue:
  - relationship: comments.on
    target: inventory_items
