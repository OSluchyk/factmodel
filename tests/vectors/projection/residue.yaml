# Test vector - spec/ALGORITHMS.md, projection.
algorithm: projection
case: residue
description: Unscoped data to reference matches no rule and is residue.
input:
  files:
  - kind: model-config
    id: vector
    framework_version: 0.0.1
    profile: retail
    anchor_entity: users
  - kind: source
    id: shop-db
    title: Shop database
    source_kind: warehouse
    access_mode: export_file
    engine: postgres
  - kind: evidence
    records:
    - id: ev-confirmed
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: catalog read
      status: confirmed
      read_on: '2026-11-01'
    - id: ev-inferred
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: column names match
      status: inferred
      read_on: '2026-11-01'
    - id: ev-unresolved
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: not checked yet
      status: unresolved
      read_on: '2026-11-01'
    - id: ev-retracted
      source: shop-db
      pin: postgres:shop.public@2026-10-01
      quote: joined on email
      status: retracted
      read_on: '2026-10-01'
      named_error: The join used email, which is not unique.
      superseded_by: ev-confirmed
  - kind: profile
    id: retail
    subject: customer
    labels:
    - customer_scoped
    - configuration
    - administrative
    - lineage
    - representation
    - unresolved
    rules:
    - when:
        evidence_status: unresolved
      label: unresolved
    - when:
        mechanism: derivation
      label: lineage
    - when:
        mechanism: representation
      label: representation
    - when:
        any_end_class: administrative
      label: administrative
    - when:
        any_end_class: configuration
      label: configuration
    - when:
        all_ends_match:
        - class: data
          subject_scoped: true
        - class: reference
        any_end_subject_scoped: true
      label: customer_scoped
  - kind: entity
    id: users
    physical_name: shop.users
    grain: one row per users row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
  - kind: entity
    id: distribution_centers
    physical_name: shop.distribution_centers
    grain: one row per distribution_centers row
    class: reference
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
  - kind: entity
    id: inventory_items
    physical_name: shop.inventory_items
    grain: one row per inventory_items row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: distribution_centers_id
      type: INT64
      nullable: true
      meaning: The distribution_centers row this row points to.
    relationships:
    - key: stored-at
      to: distribution_centers
      join: inventory_items.distribution_centers_id = distribution_centers.id
      meaning: Link from inventory_items to distribution_centers.
      mechanism: inferred_join
      cardinality: many_to_one
      evidence:
      - ev-confirmed
expected:
  labels: []
  residue:
  - relationship: inventory_items.stored-at
    target: distribution_centers
