# Test vector - spec/ALGORITHMS.md, scope.
algorithm: scope
case: chain-of-three
description: Scope passes through two admitted steps; via-path and first-step basis.
input:
  files:
  - kind: model-config
    id: vector
    framework_version: 0.0.1
    profile: retail
    anchor_entity: users
  - kind: source
    id: shop-db
    title: Shop database
    source_kind: warehouse
    access_mode: export_file
    engine: postgres
  - kind: evidence
    records:
    - id: ev-confirmed
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: catalog read
      status: confirmed
      read_on: '2026-11-01'
    - id: ev-inferred
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: column names match
      status: inferred
      read_on: '2026-11-01'
    - id: ev-unresolved
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: not checked yet
      status: unresolved
      read_on: '2026-11-01'
    - id: ev-retracted
      source: shop-db
      pin: postgres:shop.public@2026-10-01
      quote: joined on email
      status: retracted
      read_on: '2026-10-01'
      named_error: The join used email, which is not unique.
      superseded_by: ev-confirmed
  - kind: profile
    id: retail
    subject: customer
    labels:
    - customer_scoped
    - configuration
    - administrative
    - lineage
    - representation
    - reference_data
    - unresolved
    rules:
    - when:
        evidence_status: unresolved
      label: unresolved
    - when:
        mechanism: derivation
      label: lineage
    - when:
        mechanism: representation
      label: representation
    - when:
        any_end_class: administrative
      label: administrative
    - when:
        any_end_class: configuration
      label: configuration
    - when:
        all_ends_class: reference
      label: reference_data
    - when:
        all_ends_match:
        - class: data
          subject_scoped: true
        - class: reference
        any_end_subject_scoped: true
      label: customer_scoped
  - kind: entity
    id: users
    physical_name: shop.users
    grain: one row per users row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
  - kind: entity
    id: orders
    physical_name: shop.orders
    grain: one row per orders row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    anchor_reference:
      field: user_id
      evidence:
      - ev-confirmed
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: user_id
      type: INT64
      nullable: true
      meaning: The user this row belongs to.
  - kind: entity
    id: order_items
    physical_name: shop.order_items
    grain: one row per order_items row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: deleted_at IS NULL
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: orders_id
      type: INT64
      nullable: true
      meaning: The orders row this row points to.
    relationships:
    - key: part-of
      to: orders
      join: order_items.orders_id = orders.id
      meaning: Link from order_items to orders.
      mechanism: inferred_join
      cardinality: many_to_one
      scope_admission:
        basis: unique_target
        evidence:
        - ev-confirmed
      evidence:
      - ev-confirmed
  - kind: entity
    id: item_returns
    physical_name: shop.item_returns
    grain: one row per item_returns row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: order_items_id
      type: INT64
      nullable: true
      meaning: The order_items row this row points to.
    relationships:
    - key: of-item
      to: order_items
      join: item_returns.order_items_id = order_items.id
      meaning: Link from item_returns to order_items.
      mechanism: inferred_join
      cardinality: many_to_one
      scope_admission:
        basis: current_row_rule
        evidence:
        - ev-confirmed
      evidence:
      - ev-confirmed
expected:
  scope:
  - entity: item_returns
    subject_scope: transitive
    basis: current_row_rule
    via: item_returns.of-item > order_items.part-of
    reachable: true
  - entity: order_items
    subject_scope: transitive
    basis: unique_target
    via: order_items.part-of
    reachable: true
  - entity: orders
    subject_scope: direct
    basis: '-'
    via: '-'
    reachable: true
  - entity: users
    subject_scope: direct
    basis: '-'
    via: '-'
    reachable: true
  rejections: []
