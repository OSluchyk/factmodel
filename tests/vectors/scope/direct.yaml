# Test vector - spec/ALGORITHMS.md, scope.
algorithm: scope
case: direct
description: anchor_reference makes an entity direct; the anchor is direct; direct wins over an 
  admitted step; a weak anchor_reference is rejected.
input:
  files:
  - kind: source
    id: shop-db
    title: Shop database
    source_kind: warehouse
    access_mode: export_file
    engine: postgres
  - kind: evidence
    records:
    - id: ev-confirmed
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: catalog read
      status: confirmed
      read_on: '2026-11-01'
    - id: ev-inferred
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: column names match
      status: inferred
      read_on: '2026-11-01'
    - id: ev-unresolved
      source: shop-db
      pin: postgres:shop.public@2026-11-01
      quote: not checked yet
      status: unresolved
      read_on: '2026-11-01'
    - id: ev-retracted
      source: shop-db
      pin: postgres:shop.public@2026-10-01
      quote: joined on email
      status: retracted
      read_on: '2026-10-01'
      named_error: The join used email, which is not unique.
      superseded_by: ev-confirmed
  - kind: profile
    id: retail
    anchor_entity: users
    labels:
    - customer_scoped
    - configuration
    - administrative
    - lineage
    - representation
    - unresolved
    rules:
    - when:
        evidence_status: unresolved
      label: unresolved
    - when:
        mechanism: derivation
      label: lineage
    - when:
        mechanism: representation
      label: representation
    - when:
        any_end_class: administrative
      label: administrative
    - when:
        any_end_class: configuration
      label: configuration
    - when:
        all_ends_match:
        - class: data
          subject_scoped: true
        - class: reference
        any_end_subject_scoped: true
      label: customer_scoped
  - kind: entity
    id: users
    physical_name: shop.users
    grain: one row per users row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
  - kind: entity
    id: orders
    physical_name: shop.orders
    grain: one row per orders row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    anchor_reference:
      field: user_id
      evidence:
      - ev-confirmed
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: user_id
      type: INT64
      nullable: true
      meaning: The user this row belongs to.
  - kind: entity
    id: sessions
    physical_name: shop.sessions
    grain: one row per sessions row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    anchor_reference:
      field: user_id
      evidence:
      - ev-confirmed
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: user_id
      type: INT64
      nullable: true
      meaning: The user this row belongs to.
    - name: orders_id
      type: INT64
      nullable: true
      meaning: The orders row this row points to.
    relationships:
    - key: of-order
      to: orders
      join: sessions.orders_id = orders.id
      meaning: Link from sessions to orders.
      mechanism: inferred_join
      cardinality: many_to_one
      scope_admission:
        basis: unique_target
        evidence:
        - ev-confirmed
      evidence:
      - ev-confirmed
  - kind: entity
    id: guests
    physical_name: shop.guests
    grain: one row per guests row
    class: data
    status: draft
    keys:
      primary:
      - id
      current_row_rule: null
    anchor_reference:
      field: user_id
      evidence:
      - ev-unresolved
    evidence:
    - ev-confirmed
    fields:
    - name: id
      type: INT64
      nullable: false
      meaning: Identifier.
    - name: user_id
      type: INT64
      nullable: true
      meaning: The user this row belongs to.
expected:
  scope:
  - entity: guests
    subject_scope: none
    basis: '-'
    via: '-'
    reachable: false
  - entity: orders
    subject_scope: direct
    basis: '-'
    via: '-'
    reachable: true
  - entity: sessions
    subject_scope: direct
    basis: '-'
    via: '-'
    reachable: true
  - entity: users
    subject_scope: direct
    basis: '-'
    via: '-'
    reachable: true
  rejections:
  - fact: guests.anchor_reference
    reason: weak_evidence
